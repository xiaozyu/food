    // Audio Context for Wheel Ticking and Win sounds
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      try {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playWinSound() {
      try {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const freqs = [440, 554, 659, 880];
        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.12, now + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.35);
        });
      } catch (e) {}
    }

    let currentRadius = 3.0; // km
    let filterOpenOnly = true;
    let filteredStores = [];
    let currentWheelAngle = 0;
    let isSpinning = false;
    let targetStore = null;

    // Haversine formula to compute distance in km
    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371; // Earth radius in km
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function updateFilteredStores() {
      filteredStores = RESTAURANT_DB.map(store => {
        const storeLat = userLocation.lat + store.latOffset;
        const storeLng = userLocation.lng + store.lngOffset;
        const distance = calculateDistance(userLocation.lat, userLocation.lng, storeLat, storeLng);
        return {
          ...store,
          distance: Math.round(distance * 10) / 10,
          exactLat: storeLat,
          exactLng: storeLng
        };
      }).filter(store => {
        const matchesCategory = (currentCategory === 'all') || (store.category === currentCategory);
        const matchesDistance = store.distance <= currentRadius;
        const matchesOpen = !filterOpenOnly || store.openNow;
        return matchesCategory && matchesDistance && matchesOpen;
      });

      // Update indicators
      document.getElementById('item-count-text').innerText = `符合 ${filteredStores.length} 家`;
      document.getElementById('candidate-count').innerText = filteredStores.length;
      document.getElementById('filter-summary-badge').innerText = `${currentRadius}km / ${filterOpenOnly ? '營業中' : '全部狀態'}`;

      renderStoreList();
      drawRouletteWheel();
    }

    // Render category chips
    function renderCategoryChips() {
      const container = document.getElementById('category-container');
      container.innerHTML = '';
      CATEGORIES.forEach(cat => {
        const isSelected = cat.id === currentCategory;
        const chip = document.createElement('button');
        chip.className = `flex items-center space-x-1.5 px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap transition-all ${
          isSelected 
            ? 'bg-orange-500 text-white shadow-md shadow-orange-500/30' 
            : 'bg-slate-800/80 text-slate-300 hover:bg-slate-700/80 border border-slate-700'
        }`;
        chip.innerHTML = `<i class="ph-bold ${cat.icon}"></i><span>${cat.name}</span>`;
        chip.onclick = () => {
          currentCategory = cat.id;
          renderCategoryChips();
          updateFilteredStores();
        };
        container.appendChild(chip);
      });
    }

    // Render candidate store items list
    function renderStoreList() {
      const container = document.getElementById('store-list');
      container.innerHTML = '';

      if (filteredStores.length === 0) {
        container.innerHTML = `
          <div class="py-6 text-center text-xs text-slate-500 glass-card rounded-2xl">
            <i class="ph-bold ph-magnifying-glass text-2xl mb-1 text-slate-600 block"></i>
            目前條件下沒有找到外帶餐廳，請放寬距離或分類！
          </div>
        `;
        return;
      }

      filteredStores.forEach((store, idx) => {
        const row = document.createElement('div');
        row.className = "p-2.5 rounded-xl bg-slate-900/80 border border-slate-800/80 flex items-center justify-between text-xs";
        row.innerHTML = `
          <div class="flex items-center space-x-2.5 min-w-0">
            <span class="w-5 h-5 rounded-full bg-slate-800 text-orange-400 font-bold flex items-center justify-center text-[10px] shrink-0 border border-slate-700">
              ${idx + 1}
            </span>
            <div class="truncate">
              <span class="font-bold text-slate-200 block truncate">${store.name}</span>
              <span class="text-[10px] text-slate-400 flex items-center space-x-1.5">
                <span class="text-amber-400 flex items-center"><i class="ph-fill ph-star text-[10px] mr-0.5"></i>${store.rating}</span>
                <span>•</span>
                <span>${store.distance} km</span>
              </span>
            </div>
          </div>
          <span class="px-2 py-0.5 rounded text-[10px] font-semibold shrink-0 ${store.openNow ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400'}">
            ${store.openNow ? '外帶中' : '休息中'}
          </span>
        `;
        container.appendChild(row);
      });
    }

    const canvas = document.getElementById('roulette-canvas');
    const ctx = canvas.getContext('2d');
    const WHEEL_COLORS = [
      '#f97316', '#0ea5e9', '#10b981', '#8b5cf6', 
      '#ec4899', '#f59e0b', '#06b6d4', '#6366f1'
    ];

    function drawRouletteWheel() {
      const width = canvas.width;
      const height = canvas.height;
      const center = width / 2;
      const radius = center - 20;

      ctx.clearRect(0, 0, width, height);

      // Empty wheel placeholder if no stores
      if (filteredStores.length === 0) {
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.lineWidth = 6;
        ctx.strokeStyle = '#334155';
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 28px "Noto Sans TC"';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('無店家可供抽取', center, center);
        return;
      }

      const numSlices = filteredStores.length;
      const arcSize = (2 * Math.PI) / numSlices;

      // Draw sectors
      for (let i = 0; i < numSlices; i++) {
        const angle = currentWheelAngle + i * arcSize;
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius, angle, angle + arcSize);
        ctx.closePath();

        // Alternating vibrant palettes
        ctx.fillStyle = WHEEL_COLORS[i % WHEEL_COLORS.length];
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = '#0f172a';
        ctx.stroke();

        // Sector text label
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(angle + arcSize / 2);
        ctx.textAlign = 'right';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 4;
        ctx.font = 'bold 26px "Noto Sans TC"';

        const storeName = filteredStores[i].name;
        // Clip long names for clean aesthetic
        const displayName = storeName.length > 7 ? storeName.substring(0, 6) + '..' : storeName;
        ctx.fillText(displayName, radius - 35, 10);
        ctx.restore();
      }

      // Outer rim decoration
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#334155';
      ctx.stroke();
    }

    let spinVelocity = 0;
    let friction = 0.985;
    let lastTickAngle = 0;

    function spinRoulette() {
      if (isSpinning) return;
      if (filteredStores.length === 0) {
        alertFallback("目前條件下沒有店家可抽，請調整搜尋半徑或分類！");
        return;
      }
      initAudio();

      isSpinning = true;
      document.getElementById('btn-spin').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('btn-quick-spin').classList.add('opacity-50', 'pointer-events-none');

      // Random initial impulse velocity
      spinVelocity = Math.random() * 0.25 + 0.38; // initial speed radians/frame
      lastTickAngle = currentWheelAngle;

      animateSpin();
    }

    function animateSpin() {
      if (!isSpinning) return;

      currentWheelAngle += spinVelocity;
      spinVelocity *= friction; // Gradual deceleration

      // Sound ticking on sector pass
      const sliceSize = (2 * Math.PI) / filteredStores.length;
      if (Math.abs(currentWheelAngle - lastTickAngle) >= sliceSize) {
        playTickSound();
        lastTickAngle = currentWheelAngle;
      }

      drawRouletteWheel();

      if (spinVelocity > 0.002) {
        requestAnimationFrame(animateSpin);
      } else {
        // Stop spinning & calculate winner
        isSpinning = false;
        document.getElementById('btn-spin').classList.remove('opacity-50', 'pointer-events-none');
        document.getElementById('btn-quick-spin').classList.remove('opacity-50', 'pointer-events-none');
        determineWinner();
      }
    }

    function determineWinner() {
      const sliceSize = (2 * Math.PI) / filteredStores.length;
      // Top pointer is located at -Math.PI / 2 (or 3*PI/2)
      // Normalize angle between [0, 2PI)
      const normalizedAngle = ((currentWheelAngle % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI);
      const pointerAngle = (1.5 * Math.PI - normalizedAngle + 2 * Math.PI) % (2 * Math.PI);
      const winningIndex = Math.floor(pointerAngle / sliceSize) % filteredStores.length;

      targetStore = filteredStores[winningIndex];

      // Audio & Confetti Celebration
      playWinSound();
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      // Display Modal with delay
      setTimeout(() => {
        openResultModal(targetStore);
      }, 350);
    }

    function openResultModal(store) {
      if (!store) return;
      document.getElementById('res-name').innerText = store.name;
      document.getElementById('res-rating').innerText = store.rating;
      document.getElementById('res-distance').innerText = `距離 ${store.distance} km`;
      
      const catObj = CATEGORIES.find(c => c.id === store.category);
      document.getElementById('res-type').innerText = catObj ? catObj.name : '精選外帶';
      
      const fullAddress = `${store.address}`;
      document.getElementById('res-address').innerText = fullAddress;
      
      // Google Maps Direct Navigation Link
      const mapsQuery = encodeURIComponent(`${store.name} ${store.address}`);
      document.getElementById('res-maps-link').href = `https://www.google.com/maps/search/?api=1&query=${mapsQuery}`;

      // Render Menu Items & Prices
      const menuContainer = document.getElementById('menu-items-container');
      menuContainer.innerHTML = '';
      if (store.menu && store.menu.length > 0) {
        store.menu.forEach(item => {
          const itemDiv = document.createElement('div');
          itemDiv.className = "flex items-center justify-between py-1.5 border-b border-slate-800/60 last:border-b-0";
          itemDiv.innerHTML = `
            <div class="flex items-center space-x-2">
              <span class="text-xs font-semibold text-slate-200">${item.name}</span>
              ${item.tag ? `<span class="text-[9px] px-1.5 py-0.5 rounded bg-orange-500/20 text-orange-400 font-bold">${item.tag}</span>` : ''}
            </div>
            <span class="text-xs font-bold text-amber-400 font-mono">$${item.price}</span>
          `;
          menuContainer.appendChild(itemDiv);
        });
      } else {
        menuContainer.innerHTML = '<div class="text-xs text-slate-500 text-center py-2">現場提供更多豐富外帶餐點</div>';
      }

      // Show Modal
      const modal = document.getElementById('result-modal');
      const card = document.getElementById('modal-card');
      modal.classList.remove('hidden');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        card.classList.remove('scale-95');
        card.classList.add('scale-100');
      }, 10);
    }

    function closeResultModal() {
      const modal = document.getElementById('result-modal');
      const card = document.getElementById('modal-card');
      modal.classList.add('opacity-0');
      card.classList.remove('scale-100');
      card.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
      }, 300);
    }

    // In-app alert fallback without using native alert()
    function alertFallback(msg) {
      const banner = document.createElement('div');
      banner.className = 'fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-orange-600 text-white font-bold text-xs px-4 py-2.5 rounded-xl shadow-xl transition-all duration-300 transform opacity-0 -translate-y-2';
      banner.innerText = msg;
      document.body.appendChild(banner);
      setTimeout(() => {
        banner.classList.remove('opacity-0', '-translate-y-2');
      }, 10);
      setTimeout(() => {
        banner.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => banner.remove(), 300);
      }, 2500);
    }

    function requestUserLocation() {
      const locText = document.getElementById('location-address');
      const locBtnText = document.getElementById('loc-btn-text');
      const icon = document.getElementById('locate-icon');

      locText.innerText = "正在取得 GPS 定位中...";
      icon.classList.add('animate-spin');

      if (!navigator.geolocation) {
        useDefaultLocation("瀏覽器不支援 GPS，已啟用預設位置");
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          userLocation.lat = pos.coords.latitude;
          userLocation.lng = pos.coords.longitude;
          userLocation.address = `經緯度: ${userLocation.lat.toFixed(4)}, ${userLocation.lng.toFixed(4)}`;
          
          locText.innerText = `目前所在位置 (GPS 已鎖定)`;
          locBtnText.innerText = "已定位";
          icon.classList.remove('animate-spin');
          updateFilteredStores();
        },
        (err) => {
          console.warn("Geolocation denied or error:", err.message);
          useDefaultLocation("已切換至預設座標 (沙鹿生活圈)");
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 30000 }
      );
    }

    function useDefaultLocation(msg) {
      userLocation = { ...DEFAULT_COORDS };
      document.getElementById('location-address').innerText = DEFAULT_COORDS.address;
      document.getElementById('loc-btn-text').innerText = "預設位置";
      document.getElementById('locate-icon').classList.remove('animate-spin');
      if (msg) alertFallback(msg);
      updateFilteredStores();
    }

    window.addEventListener('DOMContentLoaded', () => {
      // Initialize Categories & Stores
      renderCategoryChips();
      requestUserLocation();

      // Radius Slider
      const radiusSlider = document.getElementById('radius-slider');
      radiusSlider.addEventListener('input', (e) => {
        currentRadius = parseFloat(e.target.value);
        document.getElementById('radius-val').innerText = `${currentRadius.toFixed(1)} km`;
        updateFilteredStores();
      });

      // Open status toggle
      const openBtn = document.getElementById('toggle-open-only');
      openBtn.addEventListener('click', () => {
        filterOpenOnly = !filterOpenOnly;
        if (filterOpenOnly) {
          openBtn.classList.remove('bg-slate-800', 'text-slate-400', 'border-slate-700');
          openBtn.classList.add('bg-orange-500/10', 'text-orange-400', 'border-orange-500/30');
        } else {
          openBtn.classList.add('bg-slate-800', 'text-slate-400', 'border-slate-700');
          openBtn.classList.remove('bg-orange-500/10', 'text-orange-400', 'border-orange-500/30');
        }
        updateFilteredStores();
      });

      // Spin buttons
      document.getElementById('btn-spin').addEventListener('click', spinRoulette);
      document.getElementById('btn-quick-spin').addEventListener('click', spinRoulette);

      // Re-locate button
      document.getElementById('btn-re-locate').addEventListener('click', requestUserLocation);

      // Modal Events
      document.getElementById('modal-close-btn').addEventListener('click', closeResultModal);
      document.getElementById('modal-confirm').addEventListener('click', () => {
        closeResultModal();
        alertFallback(`太棒了！準備享用 ${targetStore ? targetStore.name : '美食'} 囉！`);
      });
      document.getElementById('modal-spin-again').addEventListener('click', () => {
        closeResultModal();
        setTimeout(spinRoulette, 400);
      });

      // Close modal on clicking outside background
      document.getElementById('result-modal').addEventListener('click', (e) => {
        if (e.target.id === 'result-modal') {
          closeResultModal();
        }
      });
    });
  </script>
</body>
