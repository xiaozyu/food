<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>出門生活圈決策助手 - 附近美食/賣場/停車場雷達</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet Map CSS & JS (完全免費、免 API Key、零破圖) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    #map { height: 100%; width: 100%; z-index: 1; }
    /* 自訂圖釘跳動效果 */
    .leaflet-popup-content-wrapper {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 1rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .leaflet-popup-tip { background: #0f172a; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen overflow-hidden font-sans">

  <!-- 頂部列：中心點位置顯示、交通模式與重置定位 -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-2.5 flex items-center justify-between shrink-0 shadow-lg z-20">
    <div class="flex items-center gap-3">
      <span class="text-2xl">🧭</span>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-black bg-gradient-to-r from-orange-400 to-amber-300 bg-clip-text text-transparent">
            出門生活圈助手
          </h1>
          <span id="poolBadge" class="text-[10px] bg-orange-950 text-orange-400 border border-orange-700/60 px-2 py-0.5 rounded-full font-bold">
            符合 18 處
          </span>
        </div>
        <div class="text-[11px] text-slate-400 flex items-center gap-1.5 mt-0.5">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
          <span id="centerLocText">正在偵測中心點位置...</span>
        </div>
      </div>
    </div>
    
    <div class="flex items-center gap-2">
      <!-- 交通模式切換 -->
      <div class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs">
        <button id="btnMoto" onclick="setMode('moto')" class="px-2.5 py-1 font-bold rounded-lg bg-orange-600 text-white transition">
          🛵 騎車模式
        </button>
        <button id="btnCar" onclick="setMode('car')" class="px-2.5 py-1 font-bold rounded-lg text-slate-400 hover:text-slate-200 transition">
          🚗 開車模式
        </button>
      </div>

      <!-- 重回我目前 GPS 所在地 -->
      <button onclick="resetToMyLocation()" class="p-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs flex items-center gap-1 text-slate-200 shadow" title="回到我目前的位置">
        <span>📍</span> <span class="hidden sm:inline">我的位置</span>
      </button>
    </div>
  </header>

  <!-- 主畫面區域 -->
  <main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- 左側控制與名單卡片面板 -->
    <div class="w-full md:w-96 bg-slate-900/95 border-r border-slate-800 p-3.5 flex flex-col gap-3 overflow-y-auto shrink-0 z-10 shadow-2xl">
      
      <!-- 預估車程滑桿（擴展至 40 分鐘） -->
      <div class="bg-slate-950/70 p-2.5 rounded-xl border border-slate-800">
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-300 flex items-center gap-1">
            ⏱️ 目標車程半徑：<span id="timeVal" class="text-orange-400 font-bold text-sm">8 分鐘</span>
          </label>
          <span id="distVal" class="text-[11px] text-slate-400 font-mono">約 4.0 km</span>
        </div>
        <input id="timeSlider" type="range" min="2" max="40" value="8" step="1"
          class="w-full h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-orange-500" 
          oninput="onRadiusSliderChange(this.value)" />
        <div class="flex justify-between text-[10px] text-slate-500 mt-1 font-mono">
          <span>2分</span>
          <span>15分</span>
          <span>30分</span>
          <span>40分鐘</span>
        </div>
      </div>

      <!-- 全方位生活機能與出門分類 -->
      <div>
        <label class="text-xs font-bold text-slate-400 block mb-1.5">🏷️ 想找甚麼？（點擊切換類別）</label>
        <div class="grid grid-cols-4 gap-1.5" id="catGrid">
          <button onclick="changeCategory('FOOD_FAST', this)" class="cat-pill active py-2 px-1 bg-orange-600 text-[11px] font-bold rounded-xl border border-orange-500 text-center transition">🍟 速食連鎖</button>
          <button onclick="changeCategory('FOOD_MEAL', this)" class="cat-pill py-2 px-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-xl border border-slate-700 text-center transition">🍱 便當麵餃</button>
          <button onclick="changeCategory('FOOD_STEAK', this)" class="cat-pill py-2 px-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-xl border border-slate-700 text-center transition">🥩 排餐鍋物</button>
          <button onclick="changeCategory('FOOD_VEGE', this)" class="cat-pill py-2 px-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-xl border border-slate-700 text-center transition">🥦 素食炸物</button>
          
          <button onclick="changeCategory('DRINK', this)" class="cat-pill py-2 px-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-xl border border-slate-700 text-center transition">🧋 飲料甜品</button>

          <!-- 項目動態產生 -->
        </div>
      </div>
    </div>

    <!-- 右側：真正的互動地圖與標點規劃 -->
    <div class="flex-1 h-full relative">
      <div id="map"></div>

      <!-- 地圖互動提示小浮窗 -->
      <div class="absolute top-3 right-3 bg-slate-900/90 backdrop-blur-md px-3 py-2 rounded-xl border border-slate-800 text-[11px] text-slate-200 shadow-xl z-[1000] pointer-events-none flex items-center gap-2">
        <span class="text-orange-400 text-base">📌</span>
        <span>在地圖上<b>任意點擊</b>，可切換中心點規劃該處周邊吃喝與停車</span>
      </div>

      <div id="detailDrawer" class="absolute bottom-4 left-4 right-4 md:left-auto md:right-4 md:w-96 bg-slate-900/95 border-2 border-orange-500 rounded-3xl p-4 shadow-2xl z-[1000] hidden backdrop-blur-md">

            <p id="drawerAddr" class="text-xs text-slate-400 truncate">--</p>

      // 🅿️ 收費停車場（包含實體收費費率與規則）

        items: [{ n: "汽車臨停計時", p: "$20 / 時" }, { n: "汽車單日最高上限", p: "$100 / 日" }, { n: "機車計次收費", p: "$20 / 次(跨日另計)" }, { n: "火車通勤停放推薦", p: "位子多" }] },
      { id: "p4", name: "中港童綜合醫院訪客停車場", cat: "PARKING", lat: 24.2490, lng: 120.5480, rating: 4.0, avg: "小型車 $30/小時", addr: "梧棲區臺灣大道八段 699 號",
        items: [{ n: "汽車第1小時起算", p: "$30 / 時" }, { n: "就診蓋章折抵優惠", p: "折抵 1~2 小時" }, { n: "室內地下停車場", p: "防曬防雨" }] },

      // 🛒 大賣場／全聯／大型超市
      { id: "m_costco", name: "Costco 好市多 台中店 (開車規劃)", cat: "MART", lat: 24.1332, lng: 120.6480, rating: 4.5, avg: "量販批發/會員制", addr: "南屯區文心南三路 288 號",
        items: [{ n: "烤全雞/美式大披薩", p: "$189 / $300" }, { n: "特選無骨牛小排燒烤片", p: "秤重計價" }, { n: "地下大型停車場", p: "消費折抵" }] },
      { id: "m_carrefour", name: "家樂福 沙鹿店 (大型量販店)", cat: "MART", lat: 24.2375, lng: 120.5710, rating: 4.2, avg: "賣場/家樂福超市/美食街", addr: "沙鹿區光華路 336 號",
        items: [{ n: "量販生鮮日用品一站購足", p: "常態特價" }, { n: "附設美食街(爭鮮/三商巧福)", p: "內用冷氣" }, { n: "大型專用汽車停車場", p: "消費滿額免費停車" }] },
      { id: "m_px1", name: "全聯福利中心 沙鹿沙田店", cat: "MART", lat: 24.2315, lng: 120.5658, rating: 4.1, avg: "生鮮超市/乾貨", addr: "沙鹿區沙田路 66 號",
        items: [{ n: "生鮮蔬果/特選冷藏肉品", p: "每日特價" }, { n: "現烤麵包與現煮熱咖啡", p: "$25~$35" }, { n: "門口機車停放格", p: "免費" }] },

      // 🍻 坐坐聚餐（冷氣、大空間、適合長聊）
      { id: "g1", name: "異人館咖啡部屋 沙鹿店", cat: "GATHER", lat: 24.2405, lng: 120.5635, rating: 4.1, avg: "$360~$520", addr: "沙鹿區中山路 478 號",
        items: [{ n: "川味水煮牛煲套餐(附飲品甜點)", p: "$390" }, { n: "酸白菜海鮮鍋套餐", p: "$410" }, { n: "炸物綜合拼盤", p: "$260" }, { n: "附設專屬汽車停車格", p: "免費" }] },
      { id: "g2", name: "老井極上燒肉 福科店 (開車聚餐首選)", cat: "GATHER", lat: 24.1882, lng: 120.6120, rating: 4.8, avg: "$900~$1800", addr: "西屯區福科路 567 號",
        items: [{ n: "極上安格斯牛雙人套餐", p: "$1990" }, { n: "特選豚肉海鮮雙人套餐", p: "$2190" }, { n: "手捲干貝/無限主廚雞湯", p: "$0" }, { n: "周邊特約收費停車場", p: "可折抵" }] },
      { id: "g3", name: "屋馬燒肉 國安店 (米平方商場)", cat: "GATHER", lat: 24.1950, lng: 120.6125, rating: 4.8, avg: "$900~$1700", addr: "西屯區國安一路 168 號 B1",
        items: [{ n: "經典霜降牛雙人套餐", p: "$2080" }, { n: "極品全牛特選雙人盛合", p: "$2380" }, { n: "招牌海鮮粥", p: "推薦換購" }, { n: "米平方商場地下停車場", p: "消費折抵" }] }
    ];

    let currentStores = [];

    // 初始化地圖與定位
    window.onload = () => {
      initLeafletMap();
      initGeoLocation();
    };

    function initLeafletMap() {
      // 採用 CartoDB Dark 高對比暗色圖資（乾淨、速度極快、免 API Key）
      map = L.map('map', {
        center: [centerCoords.lat, centerCoords.lng],
        zoom: 14,
        zoomControl: true
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        maxZoom: 19
      }).addTo(map);

      storeMarkersGroup = L.layerGroup().addTo(map);

      // 中心目標圖釘（可點擊移動）
      const centerIcon = L.divIcon({
        className: 'custom-center-pin',
        html: `<div class="flex items-center justify-center w-8 h-8 bg-orange-500 text-white rounded-full border-2 border-white shadow-xl animate-bounce">📍</div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 32]
      });

      centerMarker = L.marker([centerCoords.lat, centerCoords.lng], { icon: centerIcon }).addTo(map);

      // 半徑圈
      circleLayer = L.circle([centerCoords.lat, centerCoords.lng], {
        radius: currentRadiusKm * 1000,
        color: '#f97316',
        fillColor: '#ea580c',
        fillOpacity: 0.1,
        weight: 2,
        dashArray: '5, 8'
      }).addTo(map);

      // ⭐ 核心功能：在地圖上任意點擊標點，立即規劃那裡的周邊！
      map.on('click', (e) => {
        setNewCenter(e.latlng.lat, e.latlng.lng, "自訂規劃標點");
      });
    }

    function initGeoLocation() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => {
            myRealGps = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            setNewCenter(myRealGps.lat, myRealGps.lng, "我的真實位置");
          },
          err => {
            setNewCenter(centerCoords.lat, centerCoords.lng, "沙鹿市區中心 (預設)");
          },
          { enableHighAccuracy: true, timeout: 5000 }
        );
      } else {
        setNewCenter(centerCoords.lat, centerCoords.lng, "沙鹿市區中心 (預設)");
      }
    }

    function resetToMyLocation() {
      setNewCenter(myRealGps.lat, myRealGps.lng, "我的真實位置");
      map.flyTo([myRealGps.lat, myRealGps.lng], 14);
    }

    // 變更規劃中心點（自己目前位置 OR 地圖點擊自選位置）
    function setNewCenter(lat, lng, desc = "") {
      centerCoords = { lat, lng };
      centerMarker.setLatLng([lat, lng]);
      circleLayer.setLatLng([lat, lng]);
      document.getElementById('centerLocText').innerText = `📍 中心點：${desc} (${lat.toFixed(4)}, ${lng.toFixed(4)})`;
      refreshData();
    }

    // 交通模式切換 (機車 vs 開車)
    function setMode(mode) {
      currentMode = mode;
      const btnMoto = document.getElementById('btnMoto');
      const btnCar = document.getElementById('btnCar');
      if (mode === 'moto') {
        btnMoto.className = 'px-2.5 py-1 font-bold rounded-lg bg-orange-600 text-white transition';
        btnCar.className = 'px-2.5 py-1 font-bold rounded-lg text-slate-400 hover:text-slate-200 transition';
      } else {
        btnCar.className = 'px-2.5 py-1 font-bold rounded-lg bg-orange-600 text-white transition';
        btnMoto.className = 'px-2.5 py-1 font-bold rounded-lg text-slate-400 hover:text-slate-200 transition';
      }
      onRadiusSliderChange(document.getElementById('timeSlider').value);
    }

    // 滑桿車程時間換算半徑公里數
    function onRadiusSliderChange(minutes) {
      const min = parseInt(minutes);
      document.getElementById('timeVal').innerText = `${min} 分鐘`;

      // 機車以市區約 30 km/h (0.5 km/分)，開車以 45 km/h (0.75 km/分) 計算
      const kmPerMin = currentMode === 'moto' ? 0.5 : 0.75;
      currentRadiusKm = parseFloat((min * kmPerMin).toFixed(1));
      
      document.getElementById('distVal').innerText = `約 ${currentRadiusKm} km`;
      if (circleLayer) circleLayer.setRadius(currentRadiusKm * 1000);

      refreshData();
    }

    // 分類按鈕切換
    function changeCategory(catKey, btn) {
      currentCat = catKey;
      document.querySelectorAll('.cat-pill').forEach(b => {
        b.className = 'cat-pill py-2 px-1 bg-slate-800 hover:bg-slate-700 text-[11px] font-medium text-slate-300 rounded-xl border border-slate-700 text-center transition';
      });
      btn.className = 'cat-pill active py-2 px-1 bg-orange-600 text-[11px] font-bold rounded-xl border border-orange-500 text-center transition';
      refreshData();
    }

    // 計算兩點球面距離 (公里)
    function getDistanceKm(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    }

    // 核心資料更新與過濾
    function refreshData() {
      // 1. 根據與當前中心點的實際距離篩選
      currentStores = LIFE_DATABASE.filter(s => {
        const d = getDistanceKm(centerCoords.lat, centerCoords.lng, s.lat, s.lng);
        s.currentDist = d; // 動態記錄距離
        return s.cat === currentCat && d <= currentRadiusKm;
      });

      // 依距離由近到遠排序
      currentStores.sort((a, b) => a.currentDist - b.currentDist);

      // 防呆：若範圍拉太小沒有店家，至少列出該分類離此處最近的 2 間
      if (currentStores.length === 0) {
        const allInCat = LIFE_DATABASE.filter(s => s.cat === currentCat);
        allInCat.forEach(s => s.currentDist = getDistanceKm(centerCoords.lat, centerCoords.lng, s.lat, s.lng));
        allInCat.sort((a, b) => a.currentDist - b.currentDist);
        currentStores = allInCat.slice(0, 2);
      }

      document.getElementById('poolBadge').innerText = `符合 ${currentStores.length} 處`;
      document.getElementById('filteredSummary').innerText = `${currentStores.length} 間`;

      renderList();
      renderMapMarkers();
    }

    // 渲染左側卡片列表（包含價目／費率預覽）
    function renderList() {
      const listContainer = document.getElementById('storeList');
      listContainer.innerHTML = '';

      currentStores.forEach((s, idx) => {
        const estMin = currentMode === 'moto' ? Math.round(s.currentDist * 2) + 1 : Math.round(s.currentDist * 1.4) + 2;
        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-950/80 hover:bg-slate-900 border border-slate-800/80 rounded-2xl cursor-pointer transition flex flex-col gap-1.5 shadow';
        card.onclick = () => focusStore(s);

        // 預覽前兩項菜單或費率
        const samplePreview = s.items.slice(0, 2).map(m => `${m.n} <span class="text-orange-400 font-mono font-bold">${m.p}</span>`).join(' ｜ ');

        card.innerHTML = `
          <div class="flex justify-between items-start">
            <div>
              <div class="font-black text-slate-100 text-xs flex items-center gap-1.5">
                <span>${s.name}</span>
                <span class="text-[10px] text-amber-400 font-mono font-bold">⭐ ${s.rating}</span>
              </div>
              <div class="text-[10px] text-slate-500 truncate mt-0.5">${s.addr}</div>
            </div>
            <div class="text-right shrink-0">
              <span class="text-[10px] bg-slate-900 text-orange-400 px-2 py-0.5 rounded font-mono font-bold border border-slate-800">
                ${s.avg}
              </span>
            </div>
          </div>
          <div class="text-[11px] text-slate-300 bg-slate-900/60 px-2.5 py-1.5 rounded-lg border border-slate-800/50 flex justify-between items-center">
            <span class="truncate text-slate-400 text-[10px]">${samplePreview}</span>
            <span class="text-[10px] text-orange-400 shrink-0 font-medium ml-2">${currentMode === 'moto' ? '🛵' : '🚗'} ${estMin} 分鐘</span>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    // 繪製地圖上的真實圖釘
    function renderMapMarkers() {
      storeMarkersGroup.clearLayers();

      currentStores.forEach(s => {
        // 依分類區分圖釘圖示
        let iconSymbol = '🍔';
        if (s.cat === 'PARKING') iconSymbol = '🅿️';
        if (s.cat === 'MART') iconSymbol = '🛒';
        if (s.cat === 'DRINK') iconSymbol = '🧋';
        if (s.cat === 'FOOD_STEAK') iconSymbol = '🥩';
        if (s.cat === 'FOOD_VEGE') iconSymbol = '🥦';
        if (s.cat === 'GATHER') iconSymbol = '🍻';

        const customMarkerIcon = L.divIcon({
          className: 'custom-store-pin',
          html: `
            <div class="flex items-center justify-center w-7 h-7 bg-slate-900 text-white rounded-full border-2 border-orange-500 shadow-md font-bold text-xs hover:scale-125 transition">
              ${iconSymbol}
            </div>
          `,
          iconSize: [28, 28],
          iconAnchor: [14, 14]
        });

        const marker = L.marker([s.lat, s.lng], { icon: customMarkerIcon });
        
        // 點擊圖釘彈出抽屜
        marker.on('click', () => {
          focusStore(s);
        });

        storeMarkersGroup.addLayer(marker);
      });
    }

    // 聚焦特定設施並開啟底部抽屜
    function focusStore(store) {
      map.flyTo([store.lat, store.lng], 16, { duration: 0.8 });

      const estMin = currentMode === 'moto' ? Math.round(store.currentDist * 2) + 1 : Math.round(store.currentDist * 1.4) + 2;

      // 填入詳細資訊
      document.getElementById('drawerTitle').innerText = store.name;
      document.getElementById('drawerAddr').innerText = store.addr;
      document.getElementById('drawerRate').innerText = store.avg;
      document.getElementById('drawerDistance').innerText = `${currentMode === 'moto' ? '🛵 機車' : '🚗 開車'} 約 ${estMin} 分鐘 (${store.currentDist.toFixed(1)} km)`;
      
      const badge = document.getElementById('drawerCatBadge');
      if (store.cat === 'PARKING') {
        badge.innerText = '🅿️ 收費停車場';
        document.getElementById('drawerDetailLabel').innerText = '📋 詳細計費規則與上限：';
      } else if (store.cat === 'MART') {
        badge.innerText = '🛒 大賣場/超市';
        document.getElementById('drawerDetailLabel').innerText = '🔥 賣場特色與配套：';
      } else {
        badge.innerText = '🍽️ 美食餐飲';
        document.getElementById('drawerDetailLabel').innerText = '🔥 推薦必點 & 參考價位：';
      }

      // 產生完整價目項目
      const itemsBox = document.getElementById('drawerItemsBox');
      itemsBox.innerHTML = store.items.map(item => `
        <div class="flex justify-between items-center py-0.5 border-b border-slate-900 text-[11px]">
          <span class="text-slate-300 truncate">${item.n}</span>
          <span class="text-orange-400 font-mono font-bold ml-2">${item.p}</span>
        </div>
      `).join('');

      // Google 導航 deep link
      const travelMode = currentMode === 'moto' ? 'motorcycle' : 'driving';
      const navUrl = `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(store.name + ' ' + store.addr)}&travelmode=${travelMode}`;
      document.getElementById('drawerNavBtn').href = navUrl;

      document.getElementById('detailDrawer').classList.remove('hidden');
    }

    function closeDrawer() {
      document.getElementById('detailDrawer').classList.add('hidden');
    }
  </script>
